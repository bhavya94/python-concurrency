[project]
name = "python-concurrency"
version = "0.1.0"
description = "Threads, processes and asyncio in Python, built up one concept per pull request."
readme = "README.md"
authors = [{ name = "Bhavya Sharma" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
concurrency = "python_concurrency.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
