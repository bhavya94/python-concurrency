[project]
name = "python-data-structures-and-utilities"
version = "0.1.0"
description = "Runnable, self-narrating labs for Python's runtime, concurrency, performance and data structures."
readme = "README.md"
authors = [{ name = "Bhavya Sharma" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pdsau = "python_data_structures_and_utilities.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
